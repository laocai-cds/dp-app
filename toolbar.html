<!doctype html><meta charset="utf-8"><title>ĐP</title>
<style>
html{background:#0f3a6e}*{box-sizing:border-box}body{margin:0;height:auto;background:#0f3a6e;color:#fff;font:12.5px system-ui,sans-serif;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:5px 12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}h1{font-size:14px;margin:0 8px 0 0}
button{border:0;border-radius:6px;padding:4px 9px;font:700 12px system-ui,sans-serif;cursor:pointer;background:#e8f1ff;color:#0f3a6e}
button.xa{background:#ffd23f;color:#3b2a00;padding:4px 8px}button:hover{filter:brightness(.93)}button:disabled{opacity:.5}
#xs{gap:3px 4px}span.g{display:inline-flex;align-items:center;gap:2px}span.g input{margin:0;width:13px;height:13px}
input[type=text],input[type=password]{padding:5px 8px;border-radius:6px;border:0;min-width:240px}select{padding:3px;border-radius:6px;border:0;font-size:12px}input[type=time]{padding:2px 4px;border-radius:6px;border:0;font-size:12px}
label{display:flex;gap:3px;align-items:center}#st{opacity:.95;font-size:12px;line-height:1.35;max-height:34px;overflow:hidden}.sp{flex:1}
#adm,#sch{background:#0a2a52;border-radius:6px;padding:3px 8px!important;gap:6px!important}
</style>
<div class="row"><h1 id="t">Đồng bộ đảng phí</h1><span class="sp"></span><button id="upd">Kiểm tra cập nhật</button><button id="home">Trang gqtthc</button><button id="rl">Tải lại</button></div>
<div id="xs" class="row"></div>
<div id="adm" class="row" style="display:none"><b>Quản trị:</b><label><input type="checkbox" id="all"> Chọn tất cả</label><select id="mon"></select><button id="go" style="background:#2ecc71;color:#062">▶ Lấy dữ liệu các xã đã chọn</button><button id="stop" style="background:#ff6b6b;color:#fff;display:none">■ Dừng</button><span id="prog"></span></div>
<div id="sch" class="row" style="display:none"><label><input type="checkbox" id="schOn"> ⏰ Tự chạy hằng ngày lúc</label><input type="time" id="schT" value="06:00" style="padding:5px;border-radius:6px;border:0"><span style="opacity:.85">cho các xã đã tích</span><label><input type="checkbox" id="schLg"> Tự mở cùng Windows</label><button id="schNow">Chạy thử ngay</button><button id="schLog">Xem nhật ký</button></div>
<div class="row"><span id="st">1) Đăng nhập gqtthc ở khung bên dưới  2) Bấm nút xã để lấy số liệu</span>
<span id="ask" class="row" style="display:none"><input id="code" type="password" placeholder="Nhập mã đồng bộ của xã (chỉ nhập 1 lần)"><button id="ok">Lưu và chạy</button><button id="no">Hủy</button></span></div>
<script>
const $=id=>document.getElementById(id);let cur=null;
const st=m=>$('st').textContent=m;
let mode='code';
async function run(id,code,apiUrl){st('Đang chạy… xem tiến độ ở góc phải khung gqtthc');const r=await api.run(id,code,apiUrl);
 if(r.need){cur=id;mode=r.need;$('ask').style.display='flex';$('code').value='';$('code').type=mode==='api'?'text':'password';$('code').placeholder=mode==='api'?'Dán địa chỉ Apps Script (…/exec) của trang tthc':'Nhập mã đồng bộ (chỉ nhập 1 lần)';$('code').focus();st(mode==='api'?'Cần địa chỉ Apps Script đảng phí (lưu 1 lần)':'Nhập mã đồng bộ của xã này');return}
 $('ask').style.display='none';if(r.err)st('⚠ '+r.err);else st('Đã chạy. Chờ thông báo HOÀN THÀNH ở góc phải trang (máy chủ gqtthc có thể mất 1–2 phút).')}
(async()=>{const c=await api.init();$('t').textContent=c.title+'  (v'+c.ver+')';
 ADM=c.admin;XA=c.xa;
 c.xa.forEach(x=>{const w=document.createElement('span');w.className='g';if(ADM){const k=document.createElement('input');k.type='checkbox';k.dataset.id=x.id;k.title='Chọn để lấy hàng loạt';w.appendChild(k)}
  const b=document.createElement('button');b.className='xa';b.textContent=x.label;b.onclick=()=>run(x.id);w.appendChild(b);$('xs').appendChild(w)});
 if(ADM){$('adm').style.display='flex';const n=new Date();for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1),v=d.getFullYear()+'-'+(d.getMonth()+1);const o=document.createElement('option');o.value=v;o.textContent='Tháng '+(d.getMonth()+1)+'/'+d.getFullYear()+(i?'':' (hiện tại)');$('mon').appendChild(o)}
  $('all').onchange=()=>document.querySelectorAll('#xs input[type=checkbox]').forEach(k=>k.checked=$('all').checked);
  $('go').onclick=batch;$('sch').style.display='flex';initSched();$('go').dataset.x=1;$('stop').onclick=()=>{stopped=true;api.stop();st('Đang dừng…')}}})();
let ADM=false,XA=[],stopped=false;
const checkedIds=()=>[...document.querySelectorAll('#xs input[type=checkbox]:checked')].map(k=>k.dataset.id);
async function saveSched(){return api.schedSet({enabled:$('schOn').checked,time:$('schT').value||'06:00',ids:checkedIds(),openAtLogin:$('schLg').checked})}
async function initSched(){const s=await api.schedGet();$('schOn').checked=s.enabled;$('schT').value=s.time;$('schLg').checked=s.openAtLogin;
 document.querySelectorAll('#xs input[type=checkbox]').forEach(k=>{k.checked=s.ids.includes(k.dataset.id);k.addEventListener('change',()=>{if($('schOn').checked)saveSched()})});
 ['schOn','schT','schLg'].forEach(i=>$(i).addEventListener('change',async()=>{if($('schOn').checked&&!checkedIds().length){$('schOn').checked=false;st('Hãy tích chọn các xã cần tự chạy trước');return}await saveSched();st($('schOn').checked?'Đã hẹn: mỗi ngày '+$('schT').value+' tự lấy dữ liệu '+checkedIds().length+' xã (giữ ứng dụng mở và đã đăng nhập gqtthc)':'Đã tắt hẹn giờ')}));
 $('schNow').onclick=async()=>{if(!checkedIds().length){st('Hãy tích chọn các xã trước');return}await saveSched();st('Chạy thử theo lịch…');await api.schedNow()};
 $('schLog').onclick=async()=>{const r=await api.openLog();st('Đã mở file nhật ký (Notepad). Nếu không thấy: '+r)}}
async function batch(){const ids=[...document.querySelectorAll('#xs input[type=checkbox]:checked')].map(k=>k.dataset.id);if(!ids.length){st('Hãy tích chọn ít nhất một xã');return}
 stopped=false;$('go').disabled=true;$('stop').style.display='';const res=[];const label=id=>(XA.find(x=>x.id===id)||{}).label||id;
 for(let i=0;i<ids.length;i++){if(stopped)break;const id=ids[i];$('prog').textContent='('+(i+1)+'/'+ids.length+') '+label(id)+'…';st('Đang lấy '+label(id)+' — chờ gqtthc (có thể 1–2 phút/xã)');
  const r=await api.runWait(id,$('mon').value);
  if(r.need){res.push('⚠ '+label(id)+': chưa có mã — bấm riêng nút xã này một lần để nhập mã');continue}
  if(r.err){res.push('✕ '+label(id)+': '+r.err);if(/đăng nhập/.test(r.err))break;continue}
  if(r.result==='done')res.push('✅ '+label(id));else if(r.result==='stop'||r.result==='cancel'){res.push('■ '+label(id)+': đã hủy');break}else res.push('✕ '+label(id)+': '+(r.msg||'lỗi').slice(0,70))}
 $('go').disabled=false;$('stop').style.display='none';$('prog').textContent='';st('Xong lô: '+res.join(' · '));api.addLog('Chạy tay — '+res.join(' · '))}
$('ok').onclick=()=>{const v=$('code').value.trim();if(!v)return;mode==='api'?run(cur,null,v):run(cur,v)};$('code').onkeydown=e=>{if(e.key==='Enter')$('ok').click()};
$('no').onclick=()=>{$('ask').style.display='none';st('Đã hủy')};
$('home').onclick=()=>api.nav('home');$('rl').onclick=()=>api.nav('reload');api.onStatus(st);new ResizeObserver(()=>api.bar(document.body.getBoundingClientRect().height)).observe(document.body);
let upBtn=null;
api.onUpdate(u=>{if(upBtn)upBtn.remove();upBtn=document.createElement('button');upBtn.textContent='⬇ Cập nhật lên bản '+u.ver;upBtn.style.cssText='background:#2ecc71;color:#062';
 upBtn.onclick=async()=>{if(!confirm('Cập nhật lên bản '+u.ver+'? Ứng dụng sẽ tự đóng và mở lại. Cài đặt và mã đồng bộ được giữ nguyên.'))return;upBtn.disabled=true;const r=await api.updInstall();if(r&&r.err){st('⚠ '+r.err);upBtn.disabled=false;if(confirm('Không cập nhật tự động được. Mở trang tải về trên GitHub?'))api.open(u.url)}};$('upd').before(upBtn)});
$('upd').onclick=async()=>{st('Đang kiểm tra bản mới trên GitHub…');const r=await api.updCheck();st(r.r==='new'?'Có bản mới — bấm nút xanh "Cập nhật"':r.r==='same'?'Bạn đang dùng bản mới nhất (v'+r.cur+')':'Không kiểm tra được (mạng hoặc GitHub chưa có release)')};
</script>
