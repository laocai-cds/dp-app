name: Build Windows app
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'HUONG-DAN.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Đọc số phiên bản
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Đóng gói
        shell: bash
        run: |
          npx @electron/packager . DP-DangPhi --platform=win32 --arch=x64 --icon=build/icon.ico --out=dist --overwrite --ignore="^/dist" --ignore="\.zip$" --ignore="^/\.github" --ignore="^/release"
          D=dist/DP-DangPhi-win32-x64
          for f in $D/locales/*.pak; do case $(basename $f) in en-US.pak|vi.pak) ;; *) rm "$f";; esac; done
          rm -f $D/LICENSES.chromium.html
          cp config.json $D/config.json
          cp HUONG-DAN.txt $D/HUONG-DAN.txt
          EV=$(node -p "require('electron/package.json').version")
          cp $D/resources/app.asar "app-electron-$EV.asar.bin"
          cp config.json dp-config.json
          cd dist && 7z a -tzip -mx=9 ../DP-DangPhi-win32-x64.zip DP-DangPhi-win32-x64
      - name: Bộ cài một file (Setup.exe)
        continue-on-error: true
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Phát hành (tự tạo tag theo số phiên bản trong package.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            DP-DangPhi-win32-x64.zip
            app-electron-*.asar.bin
            dp-config.json
            release/DP-DangPhi-Setup.exe
          generate_release_notes: true
